# Production stack: database, API, and a reverse proxy that handles HTTPS.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Nothing but Caddy is exposed to the internet. Postgres and the API are reachable
# only from inside the compose network, so there is no public database port to attack.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: progress
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: progress
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progress"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://progress:${POSTGRES_PASSWORD}@db:5432/progress
    volumes:
      - audio:/app/data
    depends_on:
      db: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  pgdata:
  audio:
  caddy_data:
  caddy_config:
